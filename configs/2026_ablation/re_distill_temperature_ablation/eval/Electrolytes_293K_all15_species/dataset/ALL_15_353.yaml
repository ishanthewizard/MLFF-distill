normalizer_rmsd: 0.9080543783244956
regress_stress: true
dataset_name: omol

train_dataset:
  splits:
    train:
      src: /global/homes/y/yuejian/project/MLFF-distill/yuejian/elyte_temp_data/353K/lmdbs_353K/all_trajs_uneq/train
  format: ase_db
  a2g_args:
    r_energy: True
    r_forces: True
    r_data_keys: ['spin', 'charge']
  no_shuffle: true
  transforms:
    common_transform:
      dataset_name: ${dataset.dataset_name}
    stress_reshape_transform:
      dataset_name: ${dataset.dataset_name}
  teacher_labels_folder: ${cluster.omol_path}/electrolytes_application/labels/NAPF6/s1p1

val_dataset:
  splits:
    val:
      src: /global/homes/y/yuejian/project/MLFF-distill/yuejian/elyte_temp_data/353K/lmdbs_353K/all_trajs_uneq/val
  format: ase_db
  a2g_args:
    r_energy: True
    r_forces: True
    r_data_keys: ['spin', 'charge']
  no_shuffle: true
  transforms:
    common_transform:
      dataset_name: ${dataset.dataset_name}
    stress_reshape_transform:
      dataset_name: ${dataset.dataset_name}
  teacher_labels_folder: ${cluster.omol_path}/electrolytes_application/labels/NAPF6/s1p1

