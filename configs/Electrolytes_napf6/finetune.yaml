defaults:
  - cluster: local
  - dataset: fabrice
  - element_refs: fabrice_refs
  - tasks: omol
  # - backbone: eSEN_xtra_small
  - /base
  - _self_


epochs: 1
steps: null # 80B atoms, 128 ranks, max atoms 350 (mean atoms 300)
checkpoint_every_n_steps: 1000
max_neighbors: 300

train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    omol: ${dataset.train_dataset}
  combined_dataset_config:
    sampling:
      type: temperature
      temperature: 1.0

train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.common.data_parallel.BalancedBatchSampler
    _partial_: true
    batch_size: ${batch_size}
    shuffle: true
    seed: 0
  num_workers: 0
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
          _target_: fairchem.core.units.mlip_unit.mlip_unit.initialize_finetuning_model
          checkpoint_location: ${cluster.omol_path}/ESEN_OMol_ckpts/uma-s-1p1.pt
          overrides:
            backbone:
              otf_graph: true
              max_neighbors: ${max_neighbors}
              regress_stress: ${dataset.regress_stress}
              always_use_pbc: false
            pass_through_head_outputs: ${dataset.pass_through_head_outputs}
          heads:
            efs:
              module: fairchem.core.models.uma.escn_md.MLP_EFS_Head
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 4e-4
      weight_decay: 1e-3
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2
      warmup_epochs: 0.01
      lr_min_factor: 0.01
      epochs: ${epochs}
      steps: ${steps}
    print_every: 10
    clip_grad_norm: 100
    bf16: ${bf16}
  max_epochs: ${epochs}
  max_steps: ${steps}
  evaluate_every_n_steps: 1000
  callbacks:
  - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
    checkpoint_every_n_steps: ${checkpoint_every_n_steps}
    max_saved_checkpoints: 5
  - _target_: torchtnt.framework.callbacks.TQDMProgressBar