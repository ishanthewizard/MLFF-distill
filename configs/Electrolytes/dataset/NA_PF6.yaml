normalizer_rmsd: 0.8882235505930679
regress_stress: true
dataset_name: omol

train_dataset:
  splits:
    train:
      src: ${cluster.omol_path}/electrolytes_application/data/1k_napf6_md_model/train
  format: ase_db
  transforms:
    common_transform:
      dataset_name: ${dataset.dataset_name}
