defaults: 
  - /distill # OTHER OPTIONS: 1. eSEN_train 2. /distill 3. /eSEN_eval 4. /eSEN_labels
  - override cluster: Germain
  - override backbone: eSEN_xtra_small  #Not needed for eval
  - override dataset: Solvated
  - _self_

job:
  run_name: Solvated_distill_compare
  # run_name: Solvated_undistill_compare

runner:
  train_eval_unit:
    cosine_lr_scheduler_fn:
      warmup_epochs: 0.6 # usually 0.01 but solvated and protein_ligand are so small if you use 0.01 you get div by 0 error

# hessian_coef: 60
direct_forces_coef: 30
energy_coef:        30
max_atoms: 1000
