defaults:
  - cluster: local
  - dataset: fabrice
  - element_refs: fabrice_refs
  - tasks: omat
  - /base
  - _self_

dataset:
  omol_val:
    splits:
      val:
        sample_n: 200   # ← your new value

runner:
  _target_: fairchem.core.components.evaluate.eval_runner.EvalRunner #fairchem.core.components.train.train_runner.TrainEvalRunner
  dataloader: ${eval_dataloader}
  eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    bf16: ${bf16}
    model:
      _target_: fairchem.core.units.mlip_unit.mlip_unit.load_inference_model
      checkpoint_location: ${cluster.omol_path}/TOY/inference_ckpt.pt
      return_checkpoint: False
      use_ema: True
  callbacks:
  - _target_: torchtnt.framework.callbacks.TQDMProgressBar